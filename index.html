<body>

  <canvas class="fieldc" aria-hidden="true"></canvas>
  <h1 class="sr-only">GABOS.CO — József Gábos, brand and interface design</h1>
</header>
<script>
/* Karaktermező a nyitó színben — teli, átlós márkajellel.
 * Minden cella kap jelet: kívül halvány, az átlós GABOS.CO betűiben sötét.
 * A rácsot a kód tartja (saját pozícióra rajzolt glifák), ezért nem kell
 * monospace betű hozzá. A szöveges elemek helyét kihagyjuk, hogy olvasható
 * maradjon. Reszponzív: a cellaméret és a jel mérete a vászonból jön.
 */
(function () {
  var cv = document.querySelector('.fieldc');
  if (!cv) return;
  var host = cv.parentElement;
  var ctx = cv.getContext('2d', { alpha: true });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var WORD  = ['G','A','B','O','S','C'];                       // a markajel betui
  var ARROW = ['\u2192','\u2197','\u2191','\u2196','\u2190','\u2199','\u2193','\u2198']; // az aramlas iranya

  var mask, cols, rows, cell, w, h, dpr, holes = [];
  var mx = -1e5, my = -1e5, hasPointer = false;   // a mutato helye a vasznon

  host.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;         // erintesnel marad az aramlas
    var r = host.getBoundingClientRect();
    mx = e.clientX - r.left; my = e.clientY - r.top; hasPointer = true;
  }, { passive: true });
  host.addEventListener('pointerleave', function () { hasPointer = false; }, { passive: true });

  function measureHoles() {
    // A mezo a SZOVEGET oleli korbe, nem a doboza szelet: soronkent kerjuk le
    // a tenyleges sorok teglalapjait (Range.getClientRects), es csak azokat
    // hagyjuk ki, szuk keretben. Igy nincs teljes szelessegu ures sav.
    var hr = host.getBoundingClientRect();
    holes = [];
    var pad = Math.max(6, cell ? cell * 0.55 : 8);
    host.querySelectorAll('.stage-line, .nav a').forEach(function (el) {
      var range = document.createRange();
      range.selectNodeContents(el);
      var rects = range.getClientRects();
      if (!rects.length) rects = [el.getBoundingClientRect()];
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (r.width < 2 || r.height < 2) continue;
        holes.push({
          x: r.left - hr.left - pad,
          y: r.top - hr.top - pad * 0.5,
          w: r.width + pad * 2,
          h: r.height + pad
        });
      }
      range.detach && range.detach();
    });
  }

  function build() {
    var r = host.getBoundingClientRect();
    w = Math.max(320, r.width); h = Math.max(360, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // reszponziv cellameret: kisebb kepernyon suru, de a cellaszam korlatos
    cell = w < 560 ? 9 : w < 1000 ? 11 : 12;
    cols = Math.ceil(w / cell); rows = Math.ceil(h / cell);
    while (cols * rows > 11500) { cell += 1; cols = Math.ceil(w / cell); rows = Math.ceil(h / cell); }

    // maszk: atlosan futo GABOS.CO
    var m = document.createElement('canvas');
    m.width = cols; m.height = rows;
    var mc = m.getContext('2d');
    // allo szedes, a keret aljan, majdnem teljes szelessegben
    var size = Math.min(cols * 0.20, rows * 0.42);
    mc.fillStyle = '#000';
    mc.font = '600 ' + size + 'px "Geist", Helvetica, Arial, sans-serif';
    mc.textAlign = 'center'; mc.textBaseline = 'alphabetic';
    mc.fillText('GABOS.CO', cols / 2, rows - Math.max(3, rows * 0.15));
    var d = mc.getImageData(0, 0, cols, rows).data;
    mask = new Uint8Array(cols * rows);
    for (var i = 0; i < cols * rows; i++) mask[i] = d[i * 4 + 3] > 90 ? 1 : 0;

    measureHoles();
  }

  function inHole(px, py) {
    for (var i = 0; i < holes.length; i++) {
      var o = holes[i];
      if (px > o.x && px < o.x + o.w && py > o.y && py < o.y + o.h) return true;
    }
    return false;
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // egyetlen suly, egyetlen meret, egyetlen szin: a forma a jelekbol all ossze,
    // nem kiemelesbol. A markajel csak abban ter el, hogy ott betuk allnak.
    var font = '400 ' + Math.round(cell * 0.78) + 'px "Geist", Helvetica, Arial, sans-serif';
    ctx.font = font;
    ctx.fillStyle = 'rgba(14,14,12,0.78)';
    for (var y = 0; y < rows; y++) {
      var py = y * cell + cell / 2;
      for (var x = 0; x < cols; x++) {
        var px = x * cell + cell / 2;
        if (inHole(px, py)) continue;
        var inside = mask[y * cols + x];
        var f = Math.sin(x * 0.15 + t * 0.00040)
              + Math.sin(y * 0.19 - t * 0.00029)
              + Math.sin((x + y) * 0.085 + t * 0.00017);
        if (inside) {
          ctx.fillText(WORD[Math.abs(Math.round(f * 2.4) + x + y) % WORD.length], px, py);
        } else {
          // Ket vektor osszege adja az irányt: az alap aramlas, es a mutato fele
          // mutato vektor, aminek a sulya a tavolsaggal csokken. Vektorosszeg
          // kell, nem szogatlag, kulonben a -180/+180 hataron atugrana.
          var ang;
          if (hasPointer) {
            // MINDEN nyil kulon-kulon a mutatora nez, tavolsagtol fuggetlenul
            ang = Math.atan2(my - py, mx - px);
          } else {
            // mutato nelkul marad a sajat aramlas
            ang = Math.atan2(
              Math.sin(y * 0.19 - t * 0.00029),
              Math.sin(x * 0.15 + t * 0.00040)
            );
          }
          var idx = ((Math.round(((ang + Math.PI) / (2 * Math.PI)) * 8) % 8) + 8) % 8;
          ctx.fillText(ARROW[idx], px, py);
        }
      }
    }
  }

  var raf = null, start = 0, running = false, lastDraw = 0;
  function loop(now) {
    if (!start) start = now;
    if (now - lastDraw > 33) { draw(now - start); lastDraw = now; }   // ~30 fps
    raf = requestAnimationFrame(loop);
  }
  function play() { if (running || reduce) return; running = true; raf = requestAnimationFrame(loop); }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = null; }

  build();
  if (reduce) draw(0);
  else {
    play();
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (e) { e[0].isIntersecting ? play() : stop(); },
        { threshold: 0.02 }).observe(host);
    }
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : play(); });
  }

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { build(); if (reduce) draw(0); }, 180);
  }, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { build(); if (reduce) draw(0); });
})();
</script>

<script>
/* Távcső: a kivágás a kurzort követi. Csak CSS-változót írunk, ezért a
 * böngésző nem rajzolja újra a tartalmat, csak a maszkot. */
(function () {
  var scope = document.querySelector('.scope');
  var btn = document.querySelector('.scope-btn');
  if (!scope || !btn) return;
  var x = window.innerWidth / 2, y = window.innerHeight * 0.45, pending = false;

  function apply() {
    scope.style.setProperty('--sx', x + 'px');
    scope.style.setProperty('--sy', y + 'px');
    pending = false;
  }
  window.addEventListener('pointermove', function (e) {
    if (!document.body.classList.contains('scope-on')) return;
    x = e.clientX; y = e.clientY;
    if (!pending) { pending = true; requestAnimationFrame(apply); }
  }, { passive: true });

  function toggle() {
    var on = document.body.classList.toggle('scope-on');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) apply();
  }
  btn.addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 't' || e.key === 'T') toggle();
  });
  apply();
})();
</script>
